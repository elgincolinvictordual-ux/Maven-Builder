name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzips PluginBuilder.zip if you uploaded the zip)
        run: |
          if [ -f PluginBuilder.zip ]; then
            mkdir -p _src
            unzip -q -o PluginBuilder.zip -d _src
            echo "PROJECT_DIR=$(dirname "$(find _src -name settings.gradle | head -1)")" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Generate the full JDK class library bundled in the app
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          "$JAVA_HOME_21_X64/bin/java" tools/GenJdkApi.java app/src/main/assets/jdk-api.jar

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PluginBuilder.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PluginBuilder-apk
          path: PluginBuilder.apk

      - name: Publish as a release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Plugin Builder build ${{ github.run_number }}
          files: PluginBuilder.apk
          prerelease: true
          
